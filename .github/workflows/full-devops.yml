# .github/workflows/full-devops.yml

name: Full Portfolio DevOps Enterprise Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

env:
  SITE_URL: https://vishnu-kesharwani.onrender.com

jobs:

# =====================================================
# FRONTEND CI
# =====================================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

# =====================================================
# BACKEND CI
# =====================================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: node index.js & sleep 10

# =====================================================
# SEO + SITEMAP + SEARCH CONSOLE STYLE CHECK
# =====================================================
  seo-audit:
    name: SEO Audit
    runs-on: ubuntu-latest

    steps:
      - run: curl -I $SITE_URL
      - run: curl -f $SITE_URL/robots.txt
      - run: curl -f $SITE_URL/sitemap.xml
      - run: curl -f $SITE_URL | grep -i "<title>"
      - run: curl -f $SITE_URL | grep -i "meta name=\"description\""

# =====================================================
# LIGHTHOUSE
# =====================================================
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://vishnu-kesharwani.onrender.com/
          uploadArtifacts: true
          temporaryPublicStorage: true

# =====================================================
# HEALTH CHECK + MAIL ALERT
# =====================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check Site
        id: check
        run: curl -f $SITE_URL || exit 1

      - name: Send Email If Failed
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASS }}
          subject: Website Down Alert
          to: yourmail@gmail.com
          from: GitHub Alert
          body: Your Render portfolio site is down.

# =====================================================
# BROKEN LINK SCAN
# =====================================================
  broken-links:
    name: Broken Link Scanner
    runs-on: ubuntu-latest

    steps:
      - uses: lycheeverse/lychee-action@v1
        with:
          args: ${{ env.SITE_URL }} --verbose

# =====================================================
# SECURITY SCAN
# =====================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: cd frontend && npm audit --audit-level=high || true
      - run: cd backend && npm audit --audit-level=high || true

# =====================================================
# AUTO DEPLOY TRIGGER RENDER
# =====================================================
  deploy-render:
    name: Deploy to Render
    needs:
      - frontend-ci
      - backend-ci
      - seo-audit
      - lighthouse
      - health-check
      - security-scan
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Frontend
        run: curl -X POST ${{ secrets.RENDER_FRONTEND_HOOK }}

      - name: Deploy Backend
        run: curl -X POST ${{ secrets.RENDER_BACKEND_HOOK }}

# =====================================================
# AUTO DEPENDENCY UPDATE
# =====================================================
  dependency-check:
    name: Dependency Updates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v40.1.12
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =====================================================
# SEO RANK TRACKING (Basic)
# =====================================================
  seo-rank:
    name: SEO Rank Tracking
    runs-on: ubuntu-latest

    steps:
      - run: echo "Track keywords manually in Search Console:"
      - run: echo "Vishnu Kumar Kesharwani"
      - run: echo "Bhopal Pharmacist"
      - run: echo "Vishnu Kesharwani"
      - run: echo "Vishnu Kesharwani Portfolio"
      - run: echo "Vishnu Kesharwani Resume"
      - run: echo "Vishnu Kumar"
      - run: echo "Vishnu"
      - run: echo "Vishnu Kesharwani Bhopal"
      - run: echo "Vishnu Kesharwani Bhopal Pharmacist"
      - run: echo "Best Pharmacist in Bhopal"
      - run: echo ""

# =====================================================
# PR QUALITY GATE
# ===================================================== 
  pr-gate:
    name: PR Quality Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
      - security-scan

    steps:
      - run: echo "PR passed all required checks"